<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deith Zireael</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #08080c;
      --surface: #0e0e14;
      --border: #1a1a24;
      --border-hover: #2e2a20;
      --gold: #c4a35a;
      --gold-dim: #8a7440;
      --gold-glow: rgba(196, 163, 90, 0.08);
      --text: #c8c2b4;
      --text-muted: #6a6458;
      --text-dim: #3a3830;
    }

    html { font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow-x: hidden;
      position: relative;
    }

    /* --- Grain overlay --- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* --- Ambient glow --- */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(196, 163, 90, 0.04) 0%, transparent 70%);
      border-radius: 50%;
    }
    .ambient::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 1px;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, transparent 10%, var(--border) 50%, transparent 90%);
    }

    /* --- Layout --- */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    /* --- Hero / Name --- */
    .hero {
      text-align: center;
      margin-bottom: 4.5rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.2s forwards;
    }

    .name {
      font-family: "Cinzel", serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      position: relative;
      display: inline-block;
    }

    .name::after {
      content: "";
      display: block;
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 1.2rem auto 0;
      opacity: 0;
      animation: widthReveal 0.8s ease-out 0.9s forwards;
    }

    .tagline {
      margin-top: 1.4rem;
      font-size: 0.95rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    /* --- Cards --- */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 700px;
      width: 100%;
    }

    .card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem 2rem 1.8rem;
      transition: border-color 0.4s, box-shadow 0.5s, transform 0.35s;
      opacity: 0;
    }

    .card:nth-child(1) { animation: fadeUp 0.8s ease-out 0.55s forwards; }
    .card:nth-child(2) { animation: fadeUp 0.8s ease-out 0.75s forwards; }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, var(--gold-glow) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(196, 163, 90, 0.04);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-label {
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-label::before {
      content: "";
      width: 16px;
      height: 1px;
      background: var(--gold-dim);
      opacity: 0.5;
    }

    .card-title {
      font-family: "Cinzel", serif;
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-bottom: 0.7rem;
      color: var(--text);
      transition: color 0.3s;
    }

    .card:hover .card-title {
      color: #ddd6c6;
    }

    .card-desc {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.65;
      color: var(--text-muted);
    }

    .card-arrow {
      position: absolute;
      bottom: 1.8rem;
      right: 2rem;
      font-family: "DM Mono", monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      transition: color 0.3s, transform 0.3s;
    }

    .card:hover .card-arrow {
      color: var(--gold-dim);
      transform: translateX(3px);
    }

    /* --- Footer --- */
    .footer {
      margin-top: 5rem;
      font-family: "DM Mono", monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0;
      animation: fadeUp 0.6s ease-out 1.1s forwards;
    }

    /* --- Animations --- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes widthReveal {
      from { opacity: 0; width: 0; }
      to   { opacity: 1; width: 48px; }
    }

    /* --- Responsive --- */
    @media (max-width: 680px) {
      .projects {
        grid-template-columns: 1fr;
        max-width: 400px;
      }
      .page { padding: 3rem 1.25rem; }
      .hero { margin-bottom: 3rem; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="page">
    <header class="hero">
      <h1 class="name">Deith Zireael</h1>
      <p class="tagline">Γνῶθι σεαυτόν</p>
    </header>

    <nav class="projects">
      <a href="./italy/index.html" class="card">
        <div class="card-label">01 &mdash; Art</div>
        <h2 class="card-title">Italian Renaissance</h2>
        <p class="card-desc">Notes on artists, artworks, and sacred places across Italy.</p>
        <span class="card-arrow">&rarr;</span>
      </a>
      <a href="./steam/index.html" class="card">
        <div class="card-label">02 &mdash; Games</div>
        <h2 class="card-title">Steam Library</h2>
        <p class="card-desc">A visual catalogue of my game collection.</p>
        <span class="card-arrow">&rarr;</span>
      </a>
    </nav>

    <footer class="footer">deithzireael.net</footer>
  </div>
</body>
</html>
